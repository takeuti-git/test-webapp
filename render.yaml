services:
  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: >
      sh -c "echo 'hello'"
    healthCheckPath: /health
    # preDeployCommand: "alembic upgrade head" # free tierだと使えない
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString

  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: backend
          type: web
          property: hostport

databases:
  - name: app-db
    databaseName: outfit_db
    plan: free
